---
- name: Simple Ansible Playbook Example
  hosts: all
  tasks:
    - name: Create DB user
      mysql_user:
        user: admin
        password: "{{ db_admin_password }}"

    - name: Create a new Linux user
      user:
        name: new_linux_user
        state:
        password: "{{ my_password }}"
      no_log: false

    - name: Ensure that the server certificate belongs to the specified private key
      community.crypto.openssl_certificate:
        path: "{{ config_path }}/certificates/server.crt"
        privatekey_path: "{{ config_path }}/certificates/server.key"
        provider: acme
